
apiVersion: apps/v1
kind: Deployment

metadata:
  name: alunos-tech-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: alunos-tech

  template:
    metadata:
      labels:
        app: alunos-tech

    spec:
      containers:
        - name: alunos-tech
          image: alunos-tech-pim:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: alunos-tech-service

spec:
  type: NodePort

  selector:
    app: alunos-tech

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
