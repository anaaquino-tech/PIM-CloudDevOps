
name: CI/CD - Alunos Tech

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/alunos-tech-pim

jobs:
  build:
    name: Construir, validar e publicar imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t alunos-tech-pim .

      - name: Verificar imagem criada
        run: docker image inspect alunos-tech-pim

      - name: Validar arquivo Kubernetes
        run: |
          test -f kubernetes.yaml
          echo "Arquivo Kubernetes encontrado com sucesso."

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar imagem para publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag alunos-tech-pim $IMAGE_NAME:latest
          docker tag alunos-tech-pim $IMAGE_NAME:${{ github.sha }}

      - name: Publicar imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
